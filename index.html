<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Interactive documentation for the Entertainment Services API."><title>Entertainment Services API Documentation</title><style>html,body{height:100%;margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#06111f;color:#eaf5ff}main{height:100%;display:grid;place-items:center;padding:24px;text-align:center}.card{max-width:680px;padding:30px;border:1px solid #244662;border-radius:18px;background:#0a1a2d;box-shadow:0 18px 44px rgba(0,0,0,.34)}.spinner{width:42px;height:42px;margin:0 auto 18px;border:4px solid #244662;border-top-color:#2496ff;border-radius:50%;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}h1{margin:0 0 10px;font-size:clamp(28px,5vw,44px)}p{color:#9ab3cb;line-height:1.6}code{background:#071b33;padding:2px 6px;border-radius:6px;word-break:break-all}a{color:#38bdf8}</style></head><body><main><div class="card" id="card"><div class="spinner" aria-hidden="true"></div><h1>Loading API Documentation…</h1><p>Preparing the interactive documentation in your browser.</p></div></main><script>(async()=>{const card=document.getElementById('card');try{if(!('DecompressionStream'in window))throw new Error('This browser does not support DecompressionStream. Please use the latest Chrome, Edge, Safari, or Firefox.');const base='/entertainment-api-docs/assets/';const files=['docs-part-1.b64','docs-part-2.b64'];const parts=[];for(const name of files){let response=await fetch(base+name,{cache:'no-store'});if(!response.ok){response=await fetch('assets/'+name,{cache:'no-store'});}if(!response.ok)throw new Error('Unable to load '+name+' (HTTP '+response.status+').');parts.push((await response.text()).trim());}const joined=parts.join('').replace(/\s+/g,'');const binary=Uint8Array.from(atob(joined),c=>c.charCodeAt(0));const stream=new Blob([binary]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close();}catch(error){card.innerHTML='<h1>Unable to open documentation</h1><p>'+String(error.message||error)+'</p><p>Open the <a href="health.html">GitHub Pages health check</a>.</p><p><code>a2sn2/entertainment-api-docs</code></p>';}})();</script></body></html>
