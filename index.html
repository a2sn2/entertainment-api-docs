<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Interactive documentation for the Entertainment Services API."><title>Entertainment Services API Documentation</title><style>html,body{height:100%;margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#06111f;color:#eaf5ff}main{height:100%;display:grid;place-items:center;padding:24px;text-align:center}.card{max-width:620px;padding:28px;border:1px solid #244662;border-radius:18px;background:#0a1a2d;box-shadow:0 18px 44px rgba(0,0,0,.34)}.spinner{width:42px;height:42px;margin:0 auto 18px;border:4px solid #244662;border-top-color:#2496ff;border-radius:50%;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}h1{margin:0 0 10px;font-size:clamp(28px,5vw,44px)}p{color:#9ab3cb}</style></head><body><main><div class="card"><div class="spinner" aria-hidden="true"></div><h1>Loading API Documentation…</h1><p>The documentation is being prepared locally in your browser.</p><noscript>JavaScript is required to open this interactive documentation.</noscript></div></main><script>(async()=>{try{if(!('DecompressionStream'in window))throw new Error('This browser does not support local decompression. Please use a current version of Chrome, Edge, Firefox, or Safari.');const files=['assets/docs-part-1.b64','assets/docs-part-2.b64'];const parts=await Promise.all(files.map(async file=>{const response=await fetch(file,{cache:'no-store'});if(!response.ok)throw new Error('Unable to load documentation assets.');return response.text()}));const binary=Uint8Array.from(atob(parts.join('').trim()),c=>c.charCodeAt(0));const stream=new Blob([binary]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close()}catch(error){document.querySelector('.card').innerHTML='<h1>Unable to open documentation</h1><p>'+String(error.message||error)+'</p>'}})();</script></body></html>
