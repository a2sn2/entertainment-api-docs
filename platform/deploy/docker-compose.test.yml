name: entertainment-docs-test

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: TestSql!2026_Change
    ports:
      - "14333:1433"
    volumes:
      - sqlserver-test-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          (/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1"
          || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1")
          >/dev/null 2>&1
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    environment:
      ASPNETCORE_ENVIRONMENT: Testing
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__SqlServer: Server=sqlserver,1433;Database=EntertainmentDocs_Test;User Id=sa;Password=TestSql!2026_Change;Encrypt=False;TrustServerCertificate=True;MultipleActiveResultSets=True
      Jwt__Issuer: EntertainmentDocs.Test
      Jwt__Audience: EntertainmentDocs.Web
      Jwt__SigningKey: test-only-signing-key-2026-at-least-32-characters
      BootstrapAdmin__Email: admin@test.local
      BootstrapAdmin__Password: TestAdmin!2026
      Database__ApplyMigrationsOnStartup: "true"
    depends_on:
      sqlserver:
        condition: service_healthy
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 40

  admin:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.blazor
      args:
        PROJECT: apps/EntertainmentDocs.Admin/EntertainmentDocs.Admin.csproj
        BASE_PATH: admin
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "test -f /usr/share/nginx/html/index.html && nginx -t"]
      interval: 5s
      timeout: 3s
      retries: 20

  client:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.blazor
      args:
        PROJECT: apps/EntertainmentDocs.Client/EntertainmentDocs.Client.csproj
        BASE_PATH: client
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "test -f /usr/share/nginx/html/index.html && nginx -t"]
      interval: 5s
      timeout: 3s
      retries: 20

  docs:
    build:
      context: ../..
      dockerfile: platform/deploy/Dockerfile.docs
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "test -f /usr/share/nginx/html/index.html && nginx -t"]
      interval: 5s
      timeout: 3s
      retries: 20

  gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx-gateway.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy
      admin:
        condition: service_healthy
      client:
        condition: service_healthy
      docs:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nginx -t"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  sqlserver-test-data:
