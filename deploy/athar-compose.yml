# Development/test topology only. Do not use this file as a production deployment template.
services:
  athar-sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${ATHAR_SQL_PASSWORD:?ATHAR_SQL_PASSWORD is required}"
    ports:
      - "14334:1433"
    volumes:
      - athar-sql-data:/var/opt/mssql
    restart: unless-stopped

  athar-api:
    build:
      context: ..
      dockerfile: examples/Athar/Athar.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__Athar: "Server=athar-sqlserver,1433;Database=AtharDb;User Id=sa;Password=${ATHAR_SQL_PASSWORD};TrustServerCertificate=True;Encrypt=False"
      DatabaseStartup__ApplyMigrationsOnStartup: "true"
      DatabaseStartup__SeedRolesOnStartup: "true"
      DatabaseStartup__MigrationAttempts: "90"
      DatabaseStartup__DelaySeconds: "2"
      AdminSeed__Enabled: "true"
      AdminSeed__Email: "${ATHAR_ADMIN_EMAIL:?ATHAR_ADMIN_EMAIL is required}"
      AdminSeed__DisplayName: "مسؤول منصة أثر"
      AdminSeed__Password: "${ATHAR_ADMIN_PASSWORD:?ATHAR_ADMIN_PASSWORD is required}"
    depends_on:
      - athar-sqlserver
    ports:
      - "8090:8080"
    restart: unless-stopped

volumes:
  athar-sql-data:
