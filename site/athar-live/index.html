<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>أثَر — الرابط المباشر</title>
  <style>
    :root { color-scheme: light dark; font-family: "Segoe UI", Tahoma, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: linear-gradient(135deg, #10243d, #1d4a67); color: #f7fbff; }
    main { width: min(92vw, 680px); padding: 36px; border: 1px solid rgba(255,255,255,.18); border-radius: 24px; background: rgba(7, 20, 35, .82); box-shadow: 0 24px 70px rgba(0,0,0,.35); text-align: center; }
    .badge { display: inline-block; padding: 7px 12px; border-radius: 999px; background: rgba(255,255,255,.12); font-size: .85rem; }
    h1 { margin: 18px 0 8px; font-size: clamp(2rem, 7vw, 4rem); }
    p { line-height: 1.8; color: #d8e7f2; }
    #status { margin: 24px 0; padding: 16px; border-radius: 16px; background: rgba(255,255,255,.08); }
    a.button { display: none; margin-top: 10px; padding: 13px 22px; border-radius: 12px; background: #f4c95d; color: #14243a; text-decoration: none; font-weight: 700; }
    small { display: block; margin-top: 24px; color: #9db6c9; }
  </style>
</head>
<body>
  <main>
    <span class="badge">رابط مجاني وثابت</span>
    <h1>أثَر</h1>
    <p>هذا العنوان ثابت. عندما يكون العرض المحلي شغّالًا، يحوّلك تلقائيًا إلى رابط Cloudflare المؤقت الحالي.</p>
    <div id="status" role="status" aria-live="polite">جارٍ فحص حالة العرض…</div>
    <a id="open" class="button" rel="noopener noreferrer">فتح أثَر الآن</a>
    <small>لا تستخدم بيانات حقيقية أو حساسة في النسخة التجريبية.</small>
  </main>

  <script>
    (() => {
      const targetSource = "https://raw.githubusercontent.com/a2sn2/foundationkit-dotnet/athar-live-link/site/athar-live/target.json";
      const status = document.getElementById("status");
      const open = document.getElementById("open");
      const allowed = /^https:\/\/[a-z0-9-]+\.trycloudflare\.com\/?$/i;

      fetch(`${targetSource}?t=${Date.now()}`, { cache: "no-store" })
        .then(response => {
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          return response.json();
        })
        .then(target => {
          if (target.status !== "online" || !allowed.test(target.url || "")) {
            status.textContent = "العرض متوقف حاليًا. شغّل أثَر ثم نفّذ أمر expose لإتاحة الرابط.";
            return;
          }

          status.textContent = "العرض شغّال الآن. سيتم تحويلك تلقائيًا…";
          open.href = target.url;
          open.style.display = "inline-block";
          setTimeout(() => window.location.replace(target.url), 900);
        })
        .catch(() => {
          status.textContent = "تعذر قراءة حالة العرض الآن. حاول تحديث الصفحة بعد لحظات.";
        });
    })();
  </script>
</body>
</html>
