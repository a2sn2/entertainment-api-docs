name: Build inquiry
description: Share a public, non-confidential project brief with ALHassan ALShami
title: "[Build]: "
body:
  - type: markdown
    attributes:
      value: |
        Use the FoundationKit Workbench first when possible. This issue is public; do not include passwords, customer data, internal documents, or confidential business information.

  - type: textarea
    id: project
    attributes:
      label: Project summary
      description: Paste the public-safe summary generated by the Workbench.
    validations:
      required: true

  - type: textarea
    id: result
    attributes:
      label: Desired first result
      description: What should a useful first version achieve?
    validations:
      required: true

  - type: checkboxes
    id: public-confirmation
    attributes:
      label: Public information confirmation
      options:
        - label: I confirm that this issue contains no confidential or sensitive information.
          required: true
