name: Platform CI

on:
  push:
    paths:
      - "platform/**"
      - ".github/workflows/platform-ci.yml"
  pull_request:
    paths:
      - "platform/**"
      - ".github/workflows/platform-ci.yml"

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet restore EntertainmentDocs.sln
      - run: dotnet build EntertainmentDocs.sln --configuration Release --no-restore
      - run: dotnet test EntertainmentDocs.sln --configuration Release --no-build
