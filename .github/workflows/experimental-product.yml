name: Athar Experimental Product Package

on:
  workflow_dispatch:
  push:
    tags:
      - "experimental-v*"

permissions:
  contents: read
  packages: write

concurrency:
  group: athar-experimental-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Build Windows package and validate demo
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Packages.props

      - name: Validate the free browser demo
        run: |
          node --check site/athar-demo/app.js
          test -f site/athar-demo/index.html
          test -f site/athar-demo/styles.css
          grep -q "DEMO · بدون خادم" site/athar-demo/index.html

      - name: Restore
        run: dotnet restore FoundationKit.sln

      - name: Build Athar in Release mode
        run: >-
          dotnet build
          examples/Athar/Athar.Api/Athar.Api.csproj
          --configuration Release
          --no-restore

      - name: Test Athar
        run: >-
          dotnet test
          tests/Athar.Tests/Athar.Tests.csproj
          --configuration Release
          --no-build
          --logger "trx;LogFileName=athar-experimental.trx"

      - name: Publish Windows x64 package
        run: >-
          dotnet publish
          examples/Athar/Athar.Api/Athar.Api.csproj
          --configuration Release
          --no-build
          --runtime win-x64
          --self-contained false
          --output artifacts/athar-windows-x64/app

      - name: Add product instructions
        run: |
          cp docs/EXPERIMENTAL-PRODUCT-AR.md artifacts/athar-windows-x64/README-AR.md
          cp deploy/athar-compose.yml artifacts/athar-windows-x64/athar-compose.yml
          cp scripts/athar-product.ps1 artifacts/athar-windows-x64/athar-product.ps1
          (
            cd artifacts
            zip -r athar-experimental-windows-x64.zip athar-windows-x64
          )

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: athar-experimental-windows-x64
          path: artifacts/athar-experimental-windows-x64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: athar-experimental-test-results
          path: tests/Athar.Tests/TestResults/*.trx
          if-no-files-found: ignore
          retention-days: 30

  container:
    name: Build and publish experimental container
    runs-on: ubuntu-latest
    needs: package

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Athar container
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/${owner}/foundationkit-athar"
          short_sha="${GITHUB_SHA::12}"
          docker build \
            --file examples/Athar/Athar.Api/Dockerfile \
            --tag "${image}:experimental" \
            --tag "${image}:${short_sha}" \
            .
          echo "IMAGE=${image}" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${short_sha}" >> "$GITHUB_ENV"

      - name: Sign in to GitHub Container Registry
        shell: bash
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Push experimental container
        shell: bash
        run: |
          docker push "${IMAGE}:experimental"
          docker push "${IMAGE}:${SHORT_SHA}"
          echo "Published ${IMAGE}:experimental"
          echo "Published ${IMAGE}:${SHORT_SHA}"
