name: Athar Windows Launcher Check

on:
  pull_request:
    paths:
      - "scripts/athar-product.ps1"
      - "scripts/expose-athar-tunnel.ps1"
      - "START-ATHAR.cmd"
      - "STOP-ATHAR.cmd"
      - "EXPOSE-ATHAR.cmd"
      - ".github/workflows/windows-launcher-check.yml"
  push:
    branches: [main]
    paths:
      - "scripts/athar-product.ps1"
      - "scripts/expose-athar-tunnel.ps1"
      - "START-ATHAR.cmd"
      - "STOP-ATHAR.cmd"
      - "EXPOSE-ATHAR.cmd"
      - ".github/workflows/windows-launcher-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-powershell-51:
    name: Parse and smoke test on Windows PowerShell 5.1
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Verify launchers are ASCII-only
        shell: powershell
        run: |
          $paths = @(
            "scripts/athar-product.ps1",
            "scripts/expose-athar-tunnel.ps1"
          )

          foreach ($path in $paths) {
            $bytes = [System.IO.File]::ReadAllBytes($path)
            $nonAscii = @($bytes | Where-Object { $_ -gt 127 })
            if ($nonAscii.Count -gt 0) {
              throw "$path must remain ASCII-only for Windows PowerShell 5.1."
            }
          }

      - name: Parse launchers with Windows PowerShell 5.1
        shell: powershell
        run: |
          $paths = @(
            "scripts/athar-product.ps1",
            "scripts/expose-athar-tunnel.ps1"
          )

          foreach ($path in $paths) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$tokens,
              [ref]$errors) | Out-Null

            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Error
              exit 1
            }

            Write-Host "$path parser check passed."
          }

      - name: Smoke test Native status command
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File ".\scripts\athar-product.ps1" -Action Status -Mode Native
