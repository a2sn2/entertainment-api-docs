name: FoundationKit Pages Portal

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: foundationkit-pages
  cancel-in-progress: true

jobs:
  build:
    name: Validate and package Arabic repository portal
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify portal manifest against Blazor routes
        run: python3 scripts/verify-pages.py

      - name: Check portal JavaScript syntax
        run: node --check site/app.js

      - name: Prepare GitHub Pages artifact
        run: |
          rm -rf release
          cp -R site release
          sed -i 's|<base href="./">|<base href="/foundationkit-dotnet/">|' release/index.html
          cp release/index.html release/404.html
          touch release/.nojekyll

      - name: Verify packaged portal
        run: |
          test -f release/index.html
          test -f release/404.html
          test -f release/portal-manifest.json
          grep -q '<base href="/foundationkit-dotnet/">' release/index.html
          grep -q 'FoundationKit Atlas' release/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: release

  deploy:
    name: Deploy FoundationKit Atlas
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
