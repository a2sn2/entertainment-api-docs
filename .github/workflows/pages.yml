name: FoundationKit Blazor Pages Demo

on:
  push:
    branches: [main]
    paths:
      - "samples/FoundationKit.Workbench.Client/**"
      - "samples/FoundationKit.Workbench.Contracts/**"
      - "src/FoundationKit.Blazor/**"
      - "catalog/foundationkit.catalog.json"
      - "Directory.Packages.props"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish Blazor WebAssembly client
        run: >-
          dotnet publish
          samples/FoundationKit.Workbench.Client/FoundationKit.Workbench.Client.csproj
          --configuration Release
          --output release

      - name: Prepare GitHub Pages base path
        run: |
          sed -i 's|<base href="/" />|<base href="/foundationkit-dotnet/" />|' release/wwwroot/index.html
          cp release/wwwroot/index.html release/wwwroot/404.html
          touch release/wwwroot/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: release/wwwroot

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
