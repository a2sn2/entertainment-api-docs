name: FoundationKit Pages Demo

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "catalog/foundationkit.catalog.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate static demo
        run: |
          python3 -m json.tool catalog/foundationkit.catalog.json >/dev/null
          node --check site/app.js

      - name: Assemble Pages artifact
        run: |
          mkdir -p _site/catalog
          cp -R site/. _site/
          cp catalog/foundationkit.catalog.json _site/catalog/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
