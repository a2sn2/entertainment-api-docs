name: FoundationKit CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundationkit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-pack:
    name: Build, test, catalog, contracts, and pack
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Packages.props

      - name: Verify repository boundaries
        run: bash scripts/verify-repository.sh

      - name: Validate catalog and Postman collection
        run: |
          python3 -m json.tool catalog/foundationkit.catalog.json >/dev/null
          python3 -m json.tool postman/FoundationKit.Workbench.postman_collection.json >/dev/null

      - name: Restore
        run: dotnet restore FoundationKit.sln

      - name: Build
        run: dotnet build FoundationKit.sln --configuration Release --no-restore

      - name: Check generated capability documentation
        run: >-
          dotnet run
          --project tools/FoundationKit.CatalogGenerator
          --configuration Release
          --no-build
          -- --check

      - name: Test
        run: >-
          dotnet test FoundationKit.sln
          --configuration Release
          --no-build
          --logger "trx;LogFileName=foundationkit.trx"

      - name: Publish Blazor-hosted API
        run: >-
          dotnet publish
          samples/FoundationKit.Workbench/FoundationKit.Workbench.Api.csproj
          --configuration Release
          --no-build
          --output artifacts/workbench

      - name: Pack
        run: bash scripts/pack.sh Release artifacts/packages

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundationkit-test-results
          path: tests/**/TestResults/*.trx
          if-no-files-found: ignore

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: foundationkit-packages
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: error

  workbench-sqlserver-smoke:
    name: User and admin portals with SQL Server smoke test
    runs-on: ubuntu-latest
    needs: build-test-pack

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate temporary SQL password
        shell: bash
        run: echo "FOUNDATIONKIT_SQL_PASSWORD=Fkit!$(openssl rand -hex 12)Aa1" >> "$GITHUB_ENV"

      - name: Start Workbench stack
        run: docker compose -f deploy/docker-compose.yml up --build -d

      - name: Wait for Workbench
        run: |
          for attempt in {1..120}; do
            if curl --fail --silent http://localhost:8080/api/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f deploy/docker-compose.yml ps
          exit 1

      - name: Verify Blazor portals and Swagger groups
        run: |
          curl --fail --silent http://localhost:8080/ | grep -q "blazor.webassembly.js"
          curl --fail --silent http://localhost:8080/user | grep -q "blazor.webassembly.js"
          curl --fail --silent http://localhost:8080/admin | grep -q "blazor.webassembly.js"
          swagger="$(curl --fail --silent http://localhost:8080/swagger/v1/swagger.json)"
          grep -q "CreateUserRequest" <<< "$swagger"
          grep -q "GetAdminRequestQueue" <<< "$swagger"
          grep -q "ReviewUserRequest" <<< "$swagger"

      - name: Run user-admin SQL Server workflow
        run: bash scripts/smoke-workbench.sh

      - name: Print service logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs --no-color --tail=300

      - name: Stop Workbench stack
        if: always()
        run: docker compose -f deploy/docker-compose.yml down --volumes --remove-orphans
