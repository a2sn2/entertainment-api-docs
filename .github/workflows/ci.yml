name: FoundationKit CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundationkit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-pack:
    name: Build, security checks, test, examples, portal, and pack
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan tracked source for committed secrets
        run: python3 scripts/security/scan-repository.py

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Packages.props

      - name: Verify repository boundaries
        run: bash scripts/verify-repository.sh

      - name: Validate JSON and Pages assets
        run: |
          python3 -m json.tool catalog/foundationkit.catalog.json >/dev/null
          python3 -m json.tool postman/FoundationKit.Workbench.postman_collection.json >/dev/null
          python3 -m json.tool postman/Athar.Api.postman_collection.json >/dev/null
          python3 scripts/verify-pages.py
          node --check site/app.js
          node --check site/athar-demo/app.js
          test -f site/athar-demo/index.html
          test -f site/athar-demo/styles.css
          grep -q "DEMO · بدون خادم" site/athar-demo/index.html

      - name: Validate container hardening policy
        shell: bash
        run: |
          python3 scripts/security/check-container-hardening.py
          export ATHAR_SQL_PASSWORD="ConfigOnly!$(openssl rand -hex 16)Aa1"
          export ATHAR_ADMIN_EMAIL="config-only@athar.test"
          export ATHAR_ADMIN_PASSWORD="ConfigOnlyAdmin!$(openssl rand -hex 16)Aa1"
          docker compose -f deploy/athar-compose.yml config >/dev/null

      - name: Validate repository PowerShell
        shell: pwsh
        run: |
          $allErrors = @()
          $scripts = @(
            "foundationkit.ps1",
            "scripts/pack.ps1",
            "scripts/athar-product.ps1",
            "scripts/expose-athar-tunnel.ps1",
            "deploy/run-athar-published.ps1")

          foreach ($script in $scripts) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $script,
              [ref]$tokens,
              [ref]$parseErrors) | Out-Null

            if ($parseErrors.Count -gt 0) {
              $allErrors += $parseErrors
            }
          }

          if ($allErrors.Count -gt 0) {
            $allErrors | Format-List | Out-String | Write-Error
            exit 1
          }

      - name: Restore with NuGet vulnerability audit
        run: dotnet restore FoundationKit.sln

      - name: Generate CycloneDX dependency SBOM
        run: |
          mkdir -p artifacts/security
          dotnet list FoundationKit.sln package --include-transitive --format json > artifacts/security/dotnet-packages.json
          python3 scripts/security/generate-sbom.py artifacts/security/dotnet-packages.json artifacts/security/foundationkit.cdx.json
          python3 -m json.tool artifacts/security/foundationkit.cdx.json >/dev/null

      - name: Build
        run: dotnet build FoundationKit.sln --configuration Release --no-restore

      - name: Check generated capability documentation
        run: >-
          dotnet run
          --project tools/FoundationKit.CatalogGenerator
          --configuration Release
          --no-build
          -- --check

      - name: Test
        run: >-
          dotnet test FoundationKit.sln
          --configuration Release
          --no-build
          --logger "trx;LogFileName=foundationkit.trx"

      - name: Publish Workbench
        run: >-
          dotnet publish
          samples/FoundationKit.Workbench/FoundationKit.Workbench.Api.csproj
          --configuration Release
          --no-build
          --output artifacts/workbench

      - name: Publish Athar
        run: >-
          dotnet publish
          examples/Athar/Athar.Api/Athar.Api.csproj
          --configuration Release
          --no-build
          --output artifacts/athar

      - name: Pack reusable core
        run: bash scripts/pack.sh Release artifacts/packages

      - name: Create artifact integrity evidence
        run: |
          sha256sum artifacts/packages/*.nupkg artifacts/packages/*.snupkg > artifacts/security/package-sha256.txt
          sha256sum artifacts/athar/Athar.Api.dll artifacts/workbench/FoundationKit.Workbench.Api.dll > artifacts/security/publish-sha256.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: foundationkit-test-results
          path: tests/**/TestResults/*.trx
          if-no-files-found: ignore

      - name: Upload security evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: foundationkit-security-evidence
          path: artifacts/security
          if-no-files-found: error

      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: foundationkit-packages
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: error

  sqlserver-integration-smoke:
    name: Workbench and Athar SQL Server integration
    runs-on: ubuntu-latest
    needs: build-test-pack

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate temporary integration credentials
        shell: bash
        run: |
          foundationkit_sql_password="Fkit!$(openssl rand -hex 12)Aa1"
          athar_sql_password="AtharSql!$(openssl rand -hex 12)Aa1"
          athar_admin_password="AtharAdmin!$(openssl rand -hex 12)Aa1"
          echo "::add-mask::$foundationkit_sql_password"
          echo "::add-mask::$athar_sql_password"
          echo "::add-mask::$athar_admin_password"
          echo "FOUNDATIONKIT_SQL_PASSWORD=$foundationkit_sql_password" >> "$GITHUB_ENV"
          echo "ATHAR_SQL_PASSWORD=$athar_sql_password" >> "$GITHUB_ENV"
          echo "ATHAR_ADMIN_EMAIL=admin@athar.test" >> "$GITHUB_ENV"
          echo "ATHAR_ADMIN_PASSWORD=$athar_admin_password" >> "$GITHUB_ENV"

      - name: Start Workbench stack
        run: docker compose -f deploy/docker-compose.yml up --build -d

      - name: Wait for Workbench
        run: |
          for attempt in {1..120}; do
            if curl --fail --silent http://localhost:8080/api/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f deploy/docker-compose.yml ps
          exit 1

      - name: Verify Workbench portals, MudBlazor assets, and Swagger
        run: |
          curl --fail --silent http://localhost:8080/ | grep -q "blazor.webassembly.js"
          curl --fail --silent http://localhost:8080/user | grep -q "blazor.webassembly.js"
          curl --fail --silent http://localhost:8080/admin | grep -q "blazor.webassembly.js"
          curl --fail --silent --show-error -o /dev/null http://localhost:8080/_content/MudBlazor/MudBlazor.min.css
          curl --fail --silent --show-error -o /dev/null http://localhost:8080/_content/MudBlazor/MudBlazor.min.js
          swagger="$(curl --fail --silent http://localhost:8080/swagger/v1/swagger.json)"
          grep -q "CreateUserRequest" <<< "$swagger"
          grep -q "GetAdminRequestQueue" <<< "$swagger"
          grep -q "ReviewUserRequest" <<< "$swagger"

      - name: Run Workbench SQL workflow
        run: bash scripts/smoke-workbench.sh

      - name: Print Workbench logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs --no-color --tail=300

      - name: Stop Workbench stack
        if: always()
        run: docker compose -f deploy/docker-compose.yml down --volumes --remove-orphans

      - name: Start Athar stack
        run: docker compose -f deploy/athar-compose.yml up --build -d

      - name: Wait for Athar readiness
        run: |
          for attempt in {1..150}; do
            if curl --fail --silent http://localhost:8090/health/ready >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f deploy/athar-compose.yml ps
          exit 1

      - name: Verify Athar container runs without root privileges
        run: |
          uid="$(docker compose -f deploy/athar-compose.yml exec -T athar-api id -u)"
          test "$uid" != "0"
          docker compose -f deploy/athar-compose.yml ps

      - name: Verify Arabic client, MudBlazor assets, and API surface
        run: |
          curl --fail --silent http://localhost:8090/ | grep -q "blazor.webassembly.js"
          curl --fail --silent http://localhost:8090/account | grep -q "blazor.webassembly.js"
          curl --fail --silent http://localhost:8090/initiatives | grep -q "blazor.webassembly.js"
          curl --fail --silent http://localhost:8090/admin | grep -q "blazor.webassembly.js"
          curl --fail --silent --show-error -o /dev/null http://localhost:8090/_content/MudBlazor/MudBlazor.min.css
          curl --fail --silent --show-error -o /dev/null http://localhost:8090/_content/MudBlazor/MudBlazor.min.js
          readiness="$(curl --fail --silent http://localhost:8090/health/ready)"
          grep -q '"status":"ready"' <<< "$readiness"
          ! grep -qi 'sql-server' <<< "$readiness"
          swagger="$(curl --fail --silent http://localhost:8090/swagger/v1/swagger.json)"
          grep -q "RegisterAtharUser" <<< "$swagger"
          grep -q "CreateAtharInitiative" <<< "$swagger"
          grep -q "ReviewAtharInitiative" <<< "$swagger"

      - name: Run Athar end-to-end workflow
        run: bash scripts/smoke-athar.sh

      - name: Verify Athar backup can be restored in isolation
        env:
          ATHAR_ALLOW_RESTORE_DRILL: "true"
        run: bash scripts/verify-athar-restore.sh

      - name: Print Athar logs on failure
        if: failure()
        run: docker compose -f deploy/athar-compose.yml logs --no-color --tail=400

      - name: Stop Athar stack
        if: always()
        run: docker compose -f deploy/athar-compose.yml down --volumes --remove-orphans
