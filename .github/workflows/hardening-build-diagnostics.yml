name: Hardening Build Diagnostics

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: "8.0.x"
      - name: Restore
        run: dotnet restore FoundationKit.sln --verbosity quiet
      - name: Build with compact diagnostics
        shell: bash
        run: |
          set +e
          dotnet build FoundationKit.sln --configuration Release --no-restore --verbosity quiet > build.log 2>&1
          status=$?
          grep -E 'error (CS|CA|SYSLIB|NU)[0-9]+' build.log | sort -u || true
          exit "$status"
      - name: Athar tests with compact diagnostics
        run: dotnet test tests/Athar.Tests/Athar.Tests.csproj --configuration Release --no-build --verbosity quiet
