name: Hardening Build Diagnostics

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: "8.0.x"
      - name: Restore with diagnostics
        id: restore
        continue-on-error: true
        shell: bash
        run: |
          set +e
          dotnet restore FoundationKit.sln --verbosity normal > restore.log 2>&1
          status=$?
          grep -Ei '(error|warning|invalid framework)' restore.log | sort -u > restore-errors.txt || true
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - name: Upload restore diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hardening-restore-diagnostics
          path: |
            restore.log
            restore-errors.txt
          if-no-files-found: error
      - name: Stop after restore failure
        if: steps.restore.outputs.status != '0'
        run: exit 1
      - name: Build with diagnostics
        id: build
        if: steps.restore.outputs.status == '0'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          dotnet build FoundationKit.sln --configuration Release --no-restore --verbosity normal > build.log 2>&1
          status=$?
          grep -Ei '(error|warning) (CS|CA|SYSLIB|NU|MSB|NETSDK)[0-9]+' build.log | sort -u > build-errors.txt || true
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - name: Upload build diagnostics
        if: always() && steps.restore.outputs.status == '0'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hardening-build-diagnostics
          path: |
            build.log
            build-errors.txt
          if-no-files-found: error
      - name: Fail when build failed
        if: steps.restore.outputs.status == '0' && steps.build.outputs.status != '0'
        run: exit 1
      - name: Athar tests with compact diagnostics
        if: steps.restore.outputs.status == '0' && steps.build.outputs.status == '0'
        run: dotnet test tests/Athar.Tests/Athar.Tests.csproj --configuration Release --no-build --verbosity quiet
